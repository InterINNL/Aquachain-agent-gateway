[package]
name = "aquachain-agent-gateway"
version = "0.1.0"
edition = "2021"
description = "x402 agent gateway for AquaChain drone measurements (relays to Osmosis CosmWasm)"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
base64 = { version = "0.22", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
