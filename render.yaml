services:
  - type: web
    name: aquachain-agent-gateway
    runtime: docker
    region: frankfurt
    plan: free
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AGENT_GATEWAY_HOST
        value: 0.0.0.0
      - key: AGENT_GATEWAY_PUBLIC_URL
        value: https://aquachain-agent-gateway.onrender.com
      - key: CSR_CONTRACT_ADDRESS
        value: osmo1s2a2f6je78ga2atc3rzq76lmzs9kane9h9fa3w62rjvcw5mk5lvsyxwtm4
      - key: OSMOSIS_RPC
        value: https://rpc.osmotest5.osmosis.zone
      - key: OSMOSIS_CHAIN_ID
        value: osmo-test-5
      - key: X402_DEV_BYPASS
        value: "false"
      - key: RELAYER_MNEMONIC
        sync: false
      - key: X402_PAYTO_ADDRESS
        sync: false
