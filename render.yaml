services:
  - type: web
    name: aquachain-agent-gateway
    runtime: docker
    region: frankfurt
    plan: free
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AGENT_GATEWAY_HOST
        value: 0.0.0.0
      - key: AGENT_GATEWAY_PUBLIC_URL
        value: https://aquachain-agent-gateway.onrender.com
      - key: CSR_CONTRACT_ADDRESS
        value: osmo1z86906nkwg3x7tuj3huvve52td3lx9lle6c89v6tcycy2pyg3s4qz3we47
      - key: OSMOSIS_RPC
        value: https://rpc.osmotest5.osmosis.zone
      - key: OSMOSIS_CHAIN_ID
        value: osmo-test-5
      - key: X402_DEV_BYPASS
        value: 'false'
      - key: RELAYER_MNEMONIC
        sync: false
      - key: X402_PAYTO_ADDRESS
        sync: false
